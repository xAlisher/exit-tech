prompt:
- >-
  Start by asking me about my situation carefully — country, urgency, and whether I'm planning ahead or
  in immediate danger. If it's immediate danger, point me to organizations that do this professionally
  before anything else.
- >-
  Help me with the layers that exits like this share — digital safety first (secure communications, clean
  devices, what to carry across a border), then documents, money I can access from abroad, and legal pathways
  like visas and asylum where they apply.

# drafted by qwen3.6-27b (local, Sneg) — reviewed by Claude
id: google-docs
name: Google Docs
category: digital
tagline: You don't have a file. You have a link.
why:
- Nothing lives on your disk — your work is a link, and the link's owner isn't you.
- 'Export never round-trips: download to .docx or .odt and the comments, suggestions, and edit history
  stay behind.'
extract:
- step: File → Download keeps a local copy (.docx, .odt, or PDF) — do it per document for the ones you
    care about.
- step: For everything at once, use takeout.google.com — select Drive and set the Docs format to .docx
    or .odt.
stub: true
prompt:
- 'Before recommending anything, interview me: do I co-author in real time, lean on add-ons or Apps
  Script, and how sensitive is the content?'
- Help me decide between a local-first editor (Obsidian, Logseq, Zettlr), a self-hosted suite (Nextcloud
  with Collabora, or CryptPad), or just a different cloud provider — based on the answers above.
- If I work alone, walk me through a local markdown workflow with Git for version history, so ownership
  comes back to my disk.
- If I collaborate, be honest about the cost of moving everyone versus keeping Docs for shared work and
  exporting clean copies for myself.
- Help me write a short transition message to my collaborators if I move a shared drive.

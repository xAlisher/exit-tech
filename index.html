<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exit</title>
</head>
<body>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #000; }
  .tag {
    position: fixed;
    top: 32px;
    left: 40px;
    font-family: monospace;
    font-size: 13px;
    color: #fff;
    letter-spacing: 0.04em;
    display: flex;
    align-items: center;
    gap: 2px;
  }
  .cursor {
    display: inline-block;
    width: 7px;
    height: 13px;
    background: #fff;
    animation: blink 1s step-end infinite;
  }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }
</style>
<div class="tag">Exit is culture<span class="cursor"></span></div>
</body>
</html>

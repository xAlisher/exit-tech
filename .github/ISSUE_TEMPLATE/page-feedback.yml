name: Page feedback
description: Wrong facts, missed alternative, better sources on an exit page
title: "feedback: "
labels: [page-feedback]
body:
  - type: input
    id: page
    attributes:
      label: Page
      description: Which exit page is this about? (prefilled when you arrive via the page's contribute button)
      placeholder: https://exit.tech/exit/...
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What kind of issue?
      multiple: true
      options:
        - Wrong fact
        - Missing alternative
        - Better source
        - Tone / wording
        - Something else
  - type: textarea
    id: details
    attributes:
      label: Details
      description: >
        What's wrong or missing? Links welcome. Proposed alternatives need a
        source that actually recommends them (see exit.tech/sources.html) —
        credits on this site are load-bearing.
    validations:
      required: true

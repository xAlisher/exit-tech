name: validate
on:
  pull_request:
  push:
    branches-ignore: [master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      # offline: validates schema and renders from whatever enrichment is
      # available; missing live data degrades gracefully and must not fail PRs
      - run: python3 build.py --offline
